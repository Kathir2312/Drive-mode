[project]
name = "tamilbook"
version = "0.1.0"
description = "Turn ebooks into Tamil/English audiobooks (personal use)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
tamilbook = "tamilbook.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tamilbook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
